# 공통 설정 (비밀값 없음). 각자 PC 값은 application-local.yml 또는 환경 변수로 (커밋 금지)
spring:
  application:
    name: crm
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vet_crm?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:}
    hikari:
      # DB 연결마다 세션 시간대를 한국 시간으로 (DB 설계 1장 '시간'). DEFAULT CURRENT_TIMESTAMP가 한국 시간이 된다
      connection-init-sql: SET time_zone = '+09:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # 세션 테이블은 Flyway V1(DDL 8절)이 만든다 (K19)
      initialize-schema: never
      table-name: SPRING_SESSION
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      # 정적 파일 없음. 없는 주소는 NoHandlerFoundException → C1 NOT_FOUND
      add-mappings: false
  config:
    import: optional:file:.env[.properties]

server:
  servlet:
    session:
      # 마지막 요청 뒤 8시간. '로그인 뒤 8시간'(POL-ACC-005)은 AuthSession이 로그인 시각으로 따로 본다 (#167, API 설계 1-6)
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

crm:
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    desk-password: ${SEED_DESK_PASSWORD:}
    groomer-password: ${SEED_GROOMER_PASSWORD:}
  dummy:
    # 시연용 더미 직원 5명이 같이 쓰는 비밀번호 (#147). local · demo 프로필에서만 쓰고, 비면 더미 데이터를 넣지 않는다
    staff-password: ${DUMMY_STAFF_PASSWORD:}
